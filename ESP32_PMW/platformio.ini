[platformio]
data_dir = spiffs_data ; SPIFFS/filesystem source directory for `buildfs`/`uploadfs`.
default_envs = flight

; Every src/main_*.cpp defines its own setup()/loop(), so exactly one may be
; compiled per build -- hence one env per experiment, each selecting its sketch
; via build_src_filter. Build/upload a specific one with `pio run -e <name>`.
[env]
platform = espressif32@^6.11.0
board = esp32dev
framework = arduino
monitor_speed = 921600  ; = constants.h SERIAL_BAUD
upload_speed = 115200
build_flags =
	-D SWIM_SETUP=0
	-D USE_SYNC=0
	-D SYNC_AS_SERVER=1
	-D SYNC_LATENCY_US=15
	-D ARDUINOJSON_ENABLE_COMMENTS=1 ; Allow // and /* */ comments in JSON
lib_deps =
	bblanchon/ArduinoJson@^7.2.2
monitor_filters = esp32_exception_decoder

; Default. The LLM notebook and controller/run.ipynb both drive this one.
[env:flight]
build_src_filter = -<*> +<main_flight.cpp>

; Host-driven shim: executes serial commands (cs_cal.py, tilt_servo.py).
[env:servo]
build_src_filter = -<*> +<main_servo.cpp>

; Bare CS readout, carriers never raised: does a phase pin leak into CS? (no drive)
[env:cs_raw]
build_src_filter = -<*> +<main_cs_raw.cpp>

; Runs the SPIFFS schedule spiffs_data/tilt.json on boot (tilt_sweep.py). uploadfs first.
[env:tilt]
build_src_filter = -<*> +<main_tilt.cpp>
