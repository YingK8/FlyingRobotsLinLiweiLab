[platformio]
default_envs = esp32dev
data_dir = spiffs_data

[env]
platform = espressif32@^6.11.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
	-D SWIM_SETUP=1
	-D GATE_ACTIVE_LOW=0
	-D ARDUINOJSON_ENABLE_COMMENTS=1
lib_deps =
	bblanchon/ArduinoJson@^7.2.2
board_build.filesystem = spiffs
board_build.filesystem_dir = spiffs_data

; JSON-driven 10 Hz horizontal rotating field (/horizontal_10hz.json).
[env:esp32dev]
build_src_filter = -<*> +<main.cpp>

; Pulsed-gradient conveyor, driven by /pull_impulse.json.
[env:pull_impulse]
build_src_filter = -<*> +<main_pull_impulse.cpp>
