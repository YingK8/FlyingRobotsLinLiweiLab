[platformio]
data_dir = spiffs_data ; SPIFFS/filesystem source directory for `buildfs`/`uploadfs`.
default_envs = flight

; Every src/main_*.cpp defines its own setup()/loop(), so exactly one may be
; compiled per build -- hence one env per experiment, each selecting its sketch
; via build_src_filter. Build/upload a specific one with `pio run -e <name>`.
[env]
platform = espressif32@^6.11.0
board = esp32dev
framework = arduino
monitor_speed = 921600  ; = constants.h SERIAL_BAUD
upload_speed = 115200
build_flags =
	-D SWIM_SETUP=0
	-D USE_SYNC=0
	-D SYNC_AS_SERVER=1
	-D SYNC_LATENCY_US=15
	-D ARDUINOJSON_ENABLE_COMMENTS=1 ; Allow // and /* */ comments in JSON
lib_deps =
	bblanchon/ArduinoJson@^7.2.2
monitor_filters = esp32_exception_decoder

[env:flight]
build_src_filter = -<*> +<main_flight.cpp>

; Host-driven: src/main_servo.cpp just executes serial commands; the control
; loop lives in controller/visual_servo.
[env:servo]
build_src_filter = -<*> +<main_servo.cpp>

[env:tilt]
build_src_filter = -<*> +<main_tilt.cpp>

[env:takeoff_upside_down]
build_src_filter = -<*> +<main_takeoff_upside_down.cpp>

; Characterization / calibration rigs -- see src/calibration/. These run
; PASSTHROUGH (no enableCurrentBalance) because they deliberately drive the
; channels unequally; balancing them would erase the effect being measured.
[env:coupling_test]
build_src_filter = -<*> +<calibration/main_coupling_test.cpp>

[env:comp_test]
build_src_filter = -<*> +<calibration/main_comp_test.cpp>

[env:dc]
build_src_filter = -<*> +<calibration/main_dc.cpp>

; Library demo / verification target, not a flight experiment -- see src/examples/.
[env:serialcomm_demo]
build_src_filter = -<*> +<examples/main_serialcomm_demo.cpp>
