[project]
name = "esp32-pmw-tools"
version = "0.1.0"
description = "Python tooling for ESP32_PMW (PicoScope capture/record, analysis)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "picosdk>=1.1",
    "pyserial>=3.5",
    "opencv-contrib-python>=4.10",  # cv2.aruco (ChArUco) lives in contrib
    "ipykernel>=6.29",              # model/visual_servo.ipynb
    # controller/pose/validation: offscreen rendering of the robot mesh at known
    # poses, to validate the pose estimator against ground truth.
    "trimesh>=4.0",
    "pyrender>=0.1.45",
    "pyglet<2",                     # pyrender 0.1.45 predates the pyglet 2 API break
]

# No Python package to build — this project is just scripts under tools/.
[tool.uv]
package = false
