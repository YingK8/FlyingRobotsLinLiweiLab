[platformio]
data_dir = spiffs_data ; SPIFFS/filesystem source directory for `buildfs`/`uploadfs`.

; [env:esp32dev]
[env]
platform = espressif32@^6.11.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
	-D SWIM_SETUP=1
	-D USE_SYNC=0
	-D SYNC_AS_SERVER=1
	-D SYNC_LATENCY_US=15
	-D ARDUINOJSON_ENABLE_COMMENTS=1 ; Allow // and /* */ comments in JSON
lib_deps = 
	bblanchon/ArduinoJson@^7.2.2
monitor_filters = esp32_exception_decoder

; --- The one task: JSON-driven, owns setup()/loop via src/drive_common.h ---

; Swim: 1->30Hz ramp over 20s, then 30<->22Hz undulation x5, PI-balanced.
[env:swim]
build_src_filter = +<*> -<main_*.cpp> +<main_swim.cpp>
board_build.filesystem = spiffs
board_build.filesystem_dir = spiffs_data